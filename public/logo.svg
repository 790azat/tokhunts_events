    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf2)" transform="translate(151.2 158.9) rotate(199) scale(0.465)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(129.2 172.3) rotate(218) scale(0.62)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf2)" transform="translate(104.1 177.9) rotate(237) scale(0.465)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(78.5 175.0) rotate(256) scale(0.62)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf2)" transform="translate(55.3 163.9) rotate(275) scale(0.465)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(36.9 145.8) rotate(294) scale(0.62)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(32.5 139.0) rotate(-180) scale(0.62)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf2)" transform="translate(48.8 158.9) rotate(-199) scale(0.465)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(70.8 172.3) rotate(-218) scale(0.62)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf2)" transform="translate(95.9 177.9) rotate(-237) scale(0.465)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(121.5 175.0) rotate(-256) scale(0.62)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf2)" transform="translate(144.7 163.9) rotate(-275) scale(0.465)"/>
    <use href="#leaf" x="-20" y="-60" width="40" height="60" fill="url(#lf)" transform="translate(163.1 145.8) rotate(-294) scale(0.62)"/>
  </g>

  <!-- sun -->
  <circle cx="138" cy="58" r="16" fill="#ffc93c"/>

  <!-- flamingo -->
  <g transform="translate(14 14) scale(.86)">
    <path d="M110 112 L110 176" stroke="#ff3d7f" stroke-width="4" stroke-linecap="round"/>
    <path d="M106 112 L96 138 L116 146" stroke="#ff3d7f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102 176 L118 176" stroke="#ff3d7f" stroke-width="4" stroke-linecap="round"/>
    <path d="M78 96 C78 78 104 70 126 78 C144 84 156 98 160 112 C142 108 132 118 112 118 C92 118 78 110 78 96 Z" fill="url(#fl)"/>
    <path d="M98 92 C110 82 132 84 144 100 C130 98 114 102 98 92 Z" fill="#ffb3cd"/>
    <path d="M86 92 C66 84 58 64 70 50 C80 38 94 34 92 22 C91 14 84 10 76 12" fill="none" stroke="url(#fl)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="74" cy="16" r="9" fill="#ff5a91"/>
    <circle cx="72" cy="13" r="1.8" fill="#2a1633"/>
    <path d="M68 11 C60 11 54 17 55 27 L57 32 C58 25 63 21 71 20 Z" fill="#fff"/>
    <path d="M55.3 24 L57 32 C57.5 29 59 26.5 61 25 Z" fill="#2a1633"/>
