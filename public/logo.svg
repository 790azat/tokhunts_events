    <symbol id="leaf" viewBox="-20 -60 40 60">
      <path d="M0 0 C-18 -14 -16 -44 0 -60 C16 -44 18 -14 0 0 Z"/>
    </symbol>
    <clipPath id="badge"><circle cx="100" cy="100" r="94.5"/></clipPath>
