  <!-- hibiscus -->
  <g transform="translate(46 70)">
    <g fill="#ff4f8b">
      <circle cx="0" cy="-7" r="7"/><circle cx="7" cy="-2" r="7"/><circle cx="4" cy="6" r="7"/><circle cx="-4" cy="6" r="7"/><circle cx="-7" cy="-2" r="7"/>
    </g>
    <circle r="3.5" fill="#ffc93c"/>
  </g>
  <g transform="translate(150 160) scale(.7)">
    <g fill="#9b5de5">
      <circle cx="0" cy="-7" r="7"/><circle cx="7" cy="-2" r="7"/><circle cx="4" cy="6" r="7"/><circle cx="-4" cy="6" r="7"/><circle cx="-7" cy="-2" r="7"/>
    </g>
    <circle r="3.5" fill="#ffc93c"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="160" y="84" width="6" height="10" rx="2" fill="#4cc9f0" transform="rotate(25 163 89)"/>
    <rect x="36" y="100" width="6" height="10" rx="2" fill="#ffc93c" transform="rotate(-30 39 105)"/>
    <circle cx="120" cy="30" r="3.5" fill="#9b5de5"/>
